<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>zaso runs you</title>
    <link href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #000;
            color: #fff;
            font-family: 'Luckiest Guy', cursive;
            overflow: hidden;
        }

        #snow {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .panel {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: #000;
            border: 2px solid #fff;
            border-radius: 10px;
            padding: 20px;
            text-align: center;
            z-index: 2;
        }

        .profile-pic {
            width: 100px;
            height: 100px;
            border-radius: 50%;
        }

        .username {
            margin: 10px 0;
            font-size: 24px;
            color: #FFC0CB;
            text-shadow: 2px 2px 5px rgba(255, 105, 180, 0.7);
            animation: pulse 1s infinite alternate;
        }

        @keyframes pulse {
            0% {
                transform: scale(1);
            }
            100% {
                transform: scale(1.1);
            }
        }

        .social-links a {
            color: #fff;
            text-decoration: none;
            margin: 0 10px;
        }

        .social-links a:hover {
            text-decoration: underline;
        }

        .snowflake {
            position: absolute;
            top: -10px;
            width: 10px;
            height: 10px;
            background: white;
            border-radius: 50%;
            animation-name: fall;
            animation-timing-function: linear;
            animation-iteration-count: infinite;
        }

        @keyframes fall {
            to {
                transform: translateY(100vh);
            }
        }
    </style>
</head>
<body>
    <div id="snow"></div>
    <div class="panel">
        <img src="https://cdn.discordapp.com/attachments/1216237099163062415/1294867214549258300/standard_2.gif?ex=670c9291&is=670b4111&hm=85d896aa341b8a48e0815afb48a27903098faaf48698537fddbe5027de7d8330&" alt="Profile Picture" class="profile-pic">
        <h2 class="username">zaso</h2>
        <div class="social-links">
            <a href="https://tiktok.com/@zasowithlv" target="_blank">Tiktok</a>
            <a href="https://discord.gg/2vs8SKTBUg" target="_blank">Discord</a>
            <a href="https://zasodev.xyz" target="_blank">Real site</a>
        </div>
    </div>

    <audio autoplay loop>
        <source src="https://drive.google.com/uc?export=download&id=16QeW7LVd2m5bu7GvPiLIyd0lywmWbwfw" type="audio/mpeg">
        Your browser does not support the audio element.
    </audio>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const snowContainer = document.getElementById('snow');
            const numSnowflakes = 100;

            for (let i = 0; i < numSnowflakes; i++) {
                const snowflake = document.createElement('div');
                snowflake.classList.add('snowflake');
                snowflake.style.left = Math.random() * 100 + 'vw';
                snowflake.style.animationDuration = Math.random() * 3 + 2 + 's';
                snowflake.style.opacity = Math.random();
                snowContainer.appendChild(snowflake);
            }
        });
    </script>
</body>
</html>
